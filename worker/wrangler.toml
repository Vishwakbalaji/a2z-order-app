name = "a2z-order-sync"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

# Weekly reports: a reporting week ends Friday 11:59:59 PM America/New_York = Saturday 04:00 UTC
# (daylight time) or 05:00 UTC (standard time). Both runs are scheduled; the job only finalizes
# weeks that have really ended and never creates a report twice. A daily run catches up if a
# scheduled run was ever missed.
[triggers]
crons = ["2 4,5 * * 6", "17 11 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "a2z-order-sync"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
# Websites allowed to call this API (comma separated)
ALLOWED_ORIGINS = "https://vishwakbalaji.github.io,http://localhost:4173,http://localhost:5173"
